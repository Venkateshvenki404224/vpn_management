# Built SPA assets (public/frontend/*) and the generated SPA shell are build
# artifacts — exclude them from every hook (same as the public/dist bundles).
exclude: 'node_modules|.git|vpn_management/public/frontend|vpn_management/www/vpn/index.html'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "vpn_management.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore jinja / bundles, and the standalone Vite SPA under frontend/ — it is a
        # self-contained app with its own toolchain/style (like apps/helpdesk/desk) and is
        # already excluded from eslint below; the pinned prettier 2.7.1 here does not match
        # its formatting, so gating it on this hook only produces false failures.
        exclude: |
            (?x)^(
                frontend/.*|
                vpn_management/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                vpn_management/templates/includes/.*|
                vpn_management/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                frontend/.*|
                vpn_management/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                vpn_management/templates/includes/.*|
                vpn_management/public/js/lib/.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
